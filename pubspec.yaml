name: appwrite
version: 27.1.0-rc.2
description: Appwrite is an open-source self-hosted backend server that abstracts and simplifies complex and repetitive development tasks behind a very simple REST API
homepage: https://appwrite.io
repository: https://github.com/appwrite/sdk-for-flutter
issue_tracker: https://github.com/appwrite/sdk-generator/issues
documentation: https://appwrite.io/support
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  cookie_jar: ^4.0.8
  device_info_plus: '>=11.5.0 <14.0.0'
  flutter_web_auth_2: ^5.0.0
  http: '>=0.13.6 <2.0.0'
  mqtt5_client: ^4.12.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^18.0.1
  package_info_plus: '>=8.0.2 <11.0.0'
  path_provider: ^2.1.4
  typed_data: ^1.3.2
  web_socket_channel: ^3.0.1
  web: ^1.0.0

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

# Android: the native half of Push, which runs background delivery on the same core as the
# Appwrite Android SDK. Other platforms need no native code.
flutter:
  plugin:
    platforms:
      android:
        package: io.appwrite.flutter
        pluginClass: AppwritePushPlugin
